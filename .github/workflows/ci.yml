name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".editorconfig"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".editorconfig"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  RUST_TOOLCHAIN: stable
  PORT: "24442"
  BASE_PATH: /

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: bun run lint
        working-directory: ./Code-Companion
      - run: bun run format:check
        working-directory: ./Code-Companion

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: bun run typecheck
        working-directory: ./Code-Companion

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: bun run test
        working-directory: ./Code-Companion

  test-tauri-rust:
    name: Rust unit tests (Tauri)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # Tauri pulls in glib-sys, which needs GTK development headers. Without these the
      # build script fails before a single test runs. This job has been failing on
      # glib-sys since at least commit 450329c.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --skip nostr_relay_smoke
        working-directory: ./Code-Companion/artifacts/blkspace

  test-anchor-bkspc:
    name: Anchor tests (bkspc program)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: bun run --filter @workspace/solana test:anchor
        working-directory: ./Code-Companion

  test-forge-hyperevm:
    name: Forge tests (BI9 / StakeVault / TimelockAdmin)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        run: |
          forge install foundry-rs/forge-std --no-git
        working-directory: ./Code-Companion/artifacts/hyperevm
      # `forge fmt --check` is deliberately not a gate: these contracts predate any
      # formatting standard and reformatting them would add diff noise to an audit
      # surface. Format them deliberately, separately, before the audit starts.
      - run: forge build --sizes
        working-directory: ./Code-Companion/artifacts/hyperevm
      - run: forge test -vv
        working-directory: ./Code-Companion/artifacts/hyperevm

  test-nostr-relay:
    name: Nostr relay smoke (live)
    # Public relays can flake (uptime / rate limits) — do not block merges.
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml nostr_relay_smoke -- --test-threads=1
        working-directory: ./Code-Companion/artifacts/blkspace

  bundle-budget-tier0:
    name: Bundle budget (Tier 0)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: bun run check:bundle:tier0
        working-directory: ./Code-Companion/artifacts/blkspace
        env:
          PORT: "24442"
          BASE_PATH: /

  build-web:
    name: Build (Web)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: bun run build
        working-directory: ./Code-Companion

  e2e:
    name: E2E (Playwright web preview)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: bun run --filter @workspace/blkspace build
        working-directory: ./Code-Companion
      - run: bun run --filter @workspace/blkspace e2e:install
        working-directory: ./Code-Companion
      - run: bun run --filter @workspace/blkspace e2e:browser
        working-directory: ./Code-Companion

  e2e-tauri:
    name: E2E (Playwright Tauri native)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev \
            xvfb
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: bun run --filter @workspace/blkspace e2e:install
        working-directory: ./Code-Companion
      - run: bun run --filter @workspace/blkspace e2e:tauri
        working-directory: ./Code-Companion
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-playwright-report
          path: Code-Companion/artifacts/blkspace/playwright-report/
          retention-days: 7

  # The `bkspc-devnet` feature gates the whole WB -> BKSPC settlement path. It is opt-in,
  # so nothing else in CI proves it still compiles. This is a cheap cross-platform guard:
  # the Solana/SPL crate set is the part most likely to break on a new toolchain.
  check-tauri-bkspc:
    name: Check (bkspc-devnet - ${{ matrix.os }})
    needs: [lint, typecheck]
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev
      # solana-client pulls in openssl-sys, whose build script needs to locate a real
      # OpenSSL install. The Windows runner does not ship one, so the crate fails to
      # compile there without this. Verified: ubuntu and macos pass without it.
      - name: Install OpenSSL (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # solana-client -> openssl-sys needs a real OpenSSL with import libraries.
        # Chocolatey's `openssl` package is a bare source tree with no .lib files, so
        # openssl-sys panics with "does not contain the required files to either
        # statically or dynamically link". The vcpkg `openssl:x64-windows-static`
        # triplet ships libcrypto.lib / libssl.lib and works.
        run: |
          choco install vcpkg --no-progress -y
          "C:\vcpkg" >> $env:GITHUB_PATH
          vcpkg install openssl:x64-windows-static
          $ssl = "C:\vcpkg\installed\x64-windows-static"
          "OPENSSL_DIR=$ssl" >> $env:GITHUB_ENV
          "OPENSSL_LIB_DIR=$ssl\lib" >> $env:GITHUB_ENV
          "OPENSSL_INCLUDE_DIR=$ssl\include" >> $env:GITHUB_ENV
          "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: bun run build:full
        working-directory: ./Code-Companion/artifacts/blkspace
      - name: Verify the settlement path compiles
        run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features --features bkspc-devnet
        working-directory: ./Code-Companion/artifacts/blkspace

  # Ships one installer that actually has settlement wired. Linux only, to keep CI cost
  # down; `check-tauri-bkspc` above covers the other platforms at compile level.
  build-tauri-bkspc:
    name: Build (bkspc-devnet settlement - Linux)
    needs: [lint, typecheck, test, check-tauri-bkspc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: bun run build:full
        working-directory: ./Code-Companion/artifacts/blkspace
      - run: bun run tauri:build:bkspc
        working-directory: ./Code-Companion/artifacts/blkspace
      - name: Rename installer
        run: |
          BUNDLE="Code-Companion/artifacts/blkspace/src-tauri/target/release/bundle/appimage"
          mkdir -p "$BUNDLE"
          for f in "$BUNDLE"/*.AppImage; do
            cp "$f" "$BUNDLE/BlkSpace-BKSPC-Settlement-Linux.AppImage"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: BlkSpace-BKSPC-Settlement-Linux
          path: |
            Code-Companion/artifacts/blkspace/src-tauri/target/release/bundle/appimage/BlkSpace-BKSPC-Settlement-Linux.AppImage
          if-no-files-found: error
          retention-days: 14

  build-tauri-full:
    name: Build (BlkSpace Full - ${{ matrix.os }})
    needs: [lint, typecheck, test]
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: bun run build:full
        working-directory: ./Code-Companion/artifacts/blkspace
      - run: bun run tauri build
        working-directory: ./Code-Companion/artifacts/blkspace
      - name: Rename Full installers
        shell: bash
        run: |
          BUNDLE="Code-Companion/artifacts/blkspace/src-tauri/target/release/bundle"
          if [ -d "$BUNDLE/msi" ]; then
            shopt -s nullglob
            for f in "$BUNDLE/msi"/*.msi; do
              cp "$f" "$BUNDLE/msi/BlkSpace-Full-Windows-x64.msi"
            done
          fi
          if [ -d "$BUNDLE/dmg" ]; then
            shopt -s nullglob
            for f in "$BUNDLE/dmg"/*.dmg; do
              cp "$f" "$BUNDLE/dmg/BlkSpace-Full-macOS.dmg"
            done
          fi
          if [ -d "$BUNDLE/appimage" ]; then
            shopt -s nullglob
            for f in "$BUNDLE/appimage"/*.AppImage; do
              cp "$f" "$BUNDLE/appimage/BlkSpace-Full-Linux.AppImage"
            done
          fi
      - name: Upload BlkSpace Full artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlkSpace-Full-${{ matrix.os }}
          path: |
            Code-Companion/artifacts/blkspace/src-tauri/target/release/bundle/msi/BlkSpace-Full-Windows-x64.msi
            Code-Companion/artifacts/blkspace/src-tauri/target/release/bundle/dmg/BlkSpace-Full-macOS.dmg
            Code-Companion/artifacts/blkspace/src-tauri/target/release/bundle/appimage/BlkSpace-Full-Linux.AppImage
          if-no-files-found: error

  build-tauri-yard:
    name: Build (BlkSpace Yard - ${{ matrix.os }})
    needs: [lint, typecheck, test]
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: bun run build:tier0
        working-directory: ./Code-Companion/artifacts/blkspace
      - run: bun run tauri build -- --no-default-features
        working-directory: ./Code-Companion/artifacts/blkspace
      - name: Rename Yard installers
        shell: bash
        run: |
          BUNDLE="Code-Companion/artifacts/blkspace/src-tauri/target/release/bundle"
          if [ -d "$BUNDLE/msi" ]; then
            shopt -s nullglob
            for f in "$BUNDLE/msi"/*.msi; do
              cp "$f" "$BUNDLE/msi/BlkSpace-Yard-Windows-x64.msi"
            done
          fi
          if [ -d "$BUNDLE/dmg" ]; then
            shopt -s nullglob
            for f in "$BUNDLE/dmg"/*.dmg; do
              cp "$f" "$BUNDLE/dmg/BlkSpace-Yard-macOS.dmg"
            done
          fi
          if [ -d "$BUNDLE/appimage" ]; then
            shopt -s nullglob
            for f in "$BUNDLE/appimage"/*.AppImage; do
              cp "$f" "$BUNDLE/appimage/BlkSpace-Yard-Linux.AppImage"
            done
          fi
      - name: Upload BlkSpace Yard artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlkSpace-Yard-${{ matrix.os }}
          path: |
            Code-Companion/artifacts/blkspace/src-tauri/target/release/bundle/msi/BlkSpace-Yard-Windows-x64.msi
            Code-Companion/artifacts/blkspace/src-tauri/target/release/bundle/dmg/BlkSpace-Yard-macOS.dmg
            Code-Companion/artifacts/blkspace/src-tauri/target/release/bundle/appimage/BlkSpace-Yard-Linux.AppImage
          if-no-files-found: error

  build-tauri-iroh:
    name: Build (Tauri + Iroh - Linux)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: bun run --filter @workspace/blkspace test:iroh
        working-directory: ./Code-Companion
      - run: bun run tauri build -- --features iroh
        working-directory: ./Code-Companion/artifacts/blkspace
