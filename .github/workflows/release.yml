name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v0.1.0-yard)"
        required: true
        type: string

permissions:
  contents: write

env:
  PNPM_VERSION: 10
  NODE_VERSION: 22

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create-release.outputs.upload_url }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - id: create-release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          # Student Yard tags ship as published releases (not draft)
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.tag, 'yard') || contains(steps.meta.outputs.tag, 'alpha') || contains(steps.meta.outputs.tag, 'rc') }}
          generate_release_notes: true
          name: BlkSpace ${{ steps.meta.outputs.tag }}
          body: |
            ## BlkSpace ${{ steps.meta.outputs.tag }}

            **Product mark:** BlkSpace (orange capital **B**) · **Coin ticker:** BKSPC (gated settlement)

            ### Students (Yard build — Tier 0)
            Download **BlkSpace-Yard-*** assets below (Windows `.msi`, macOS `.dmg`, Linux `.AppImage`).

            - Install guide: [TIER0_USER.md](https://github.com/er1cbrown/BlkSpace/blob/main/TIER0_USER.md)
            - First run / recovery phrase: [FIRST_RUN.md](https://github.com/er1cbrown/BlkSpace/blob/main/FIRST_RUN.md)
            - Release notes: [docs/releases/v0.1.0-yard.md](https://github.com/er1cbrown/BlkSpace/blob/main/docs/releases/v0.1.0-yard.md)

            ### Not included
            Live streaming · mainnet BKSPC rights · Full mesh build is separate (**BlkSpace-Full-*** assets if attached).

  build-yard:
    name: Release Yard (${{ matrix.os }})
    needs: create-release
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dmg
            arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: dmg
            arch: x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: appimage
            arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: msi
            arch: x64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: Code-Companion/pnpm-lock.yaml
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev
      - run: pnpm install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: pnpm build:tier0
        working-directory: ./Code-Companion/artifacts/blkspace
      - run: pnpm tauri build --target ${{ matrix.target }} -- --no-default-features
        working-directory: ./Code-Companion/artifacts/blkspace
      - name: Package Yard artifact
        shell: bash
        run: |
          BUNDLE="Code-Companion/artifacts/blkspace/src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "${{ matrix.ext }}" = "msi" ]; then
            cp "$BUNDLE/msi"/*.msi "$BUNDLE/msi/BlkSpace-Yard-Windows-x64.msi"
          elif [ "${{ matrix.ext }}" = "dmg" ]; then
            cp "$BUNDLE/dmg"/*.dmg "$BUNDLE/dmg/BlkSpace-Yard-macOS-${{ matrix.arch }}.dmg"
          elif [ "${{ matrix.ext }}" = "appimage" ]; then
            cp "$BUNDLE/appimage"/*.AppImage "$BUNDLE/appimage/BlkSpace-Yard-Linux.AppImage"
          fi
      - name: Upload Yard artifact
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            Code-Companion/artifacts/blkspace/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.ext }}/BlkSpace-Yard-*
          tag_name: ${{ needs.create-release.outputs.tag }}

  build-full:
    name: Release Full (${{ matrix.os }})
    needs: create-release
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dmg
            arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: dmg
            arch: x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: appimage
            arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: msi
            arch: x64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: Code-Companion/pnpm-lock.yaml
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev
      - run: pnpm install --frozen-lockfile
        working-directory: ./Code-Companion
      - run: pnpm build:full
        working-directory: ./Code-Companion/artifacts/blkspace
      - run: pnpm tauri build --target ${{ matrix.target }}
        working-directory: ./Code-Companion/artifacts/blkspace
      - name: Package Full artifact
        shell: bash
        run: |
          BUNDLE="Code-Companion/artifacts/blkspace/src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "${{ matrix.ext }}" = "msi" ]; then
            cp "$BUNDLE/msi"/*.msi "$BUNDLE/msi/BlkSpace-Full-Windows-x64.msi"
          elif [ "${{ matrix.ext }}" = "dmg" ]; then
            cp "$BUNDLE/dmg"/*.dmg "$BUNDLE/dmg/BlkSpace-Full-macOS-${{ matrix.arch }}.dmg"
          elif [ "${{ matrix.ext }}" = "appimage" ]; then
            cp "$BUNDLE/appimage"/*.AppImage "$BUNDLE/appimage/BlkSpace-Full-Linux.AppImage"
          fi
      - name: Upload Full artifact
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            Code-Companion/artifacts/blkspace/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.ext }}/BlkSpace-Full-*
          tag_name: ${{ needs.create-release.outputs.tag }}