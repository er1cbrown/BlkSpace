name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.14"

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - id: create-release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: BlkSpace ${{ github.ref_name }}

  build-yard:
    name: Release Yard (${{ matrix.os }})
    needs: create-release
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dmg
            arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: dmg
            arch: x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: appimage
            arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: msi
            arch: x64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - name: Detect Apple signing
        id: apple_sign
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets absent — uploading unsigned DMG"
          fi
      - name: Detect Windows signing
        id: win_sign
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT) -and -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Windows signing secrets absent — uploading unsigned MSI"
          }
      - run: bun run build:tier0
        working-directory: ./Code-Companion/artifacts/blkspace
      - name: Build Yard installer (signed macOS)
        if: matrix.os == 'macos-latest' && steps.apple_sign.outputs.enabled == 'true'
        run: bun run tauri build --target ${{ matrix.target }} -- --no-default-features
        working-directory: ./Code-Companion/artifacts/blkspace
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build Yard installer
        if: matrix.os != 'macos-latest' || steps.apple_sign.outputs.enabled != 'true'
        run: bun run tauri build --target ${{ matrix.target }} -- --no-default-features
        working-directory: ./Code-Companion/artifacts/blkspace
      - name: Sign Windows Yard installer
        if: matrix.os == 'windows-latest' && steps.win_sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "blkspace-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT))
          $bundle = "Code-Companion/artifacts/blkspace/src-tauri/target/${{ matrix.target }}/release/bundle/msi"
          Get-ChildItem $bundle -Filter *.msi | ForEach-Object {
            signtool sign /fd SHA256 /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 /d "BlkSpace Yard" $_.FullName
          }
          Remove-Item $certPath -Force
      - name: Package Yard artifact
        shell: bash
        run: |
          BUNDLE="Code-Companion/artifacts/blkspace/src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "${{ matrix.ext }}" = "msi" ]; then
            cp "$BUNDLE/msi"/*.msi "$BUNDLE/msi/BlkSpace-Yard-Windows-x64.msi"
          elif [ "${{ matrix.ext }}" = "dmg" ]; then
            cp "$BUNDLE/dmg"/*.dmg "$BUNDLE/dmg/BlkSpace-Yard-macOS-${{ matrix.arch }}.dmg"
          elif [ "${{ matrix.ext }}" = "appimage" ]; then
            cp "$BUNDLE/appimage"/*.AppImage "$BUNDLE/appimage/BlkSpace-Yard-Linux.AppImage"
          fi
      - name: Upload Yard artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Code-Companion/artifacts/blkspace/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.ext }}/BlkSpace-Yard-*
          tag_name: ${{ github.ref_name }}

  build-full:
    name: Release Full (${{ matrix.os }})
    needs: create-release
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dmg
            arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: dmg
            arch: x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: appimage
            arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: msi
            arch: x64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev
      - run: bun install --frozen-lockfile
        working-directory: ./Code-Companion
      - name: Detect Apple signing
        id: apple_sign
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets absent — uploading unsigned DMG"
          fi
      - name: Detect Windows signing
        id: win_sign
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT) -and -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Windows signing secrets absent — uploading unsigned MSI"
          }
      - run: bun run build:full
        working-directory: ./Code-Companion/artifacts/blkspace
      - name: Build Full installer (signed macOS)
        if: matrix.os == 'macos-latest' && steps.apple_sign.outputs.enabled == 'true'
        run: bun run tauri build --target ${{ matrix.target }}
        working-directory: ./Code-Companion/artifacts/blkspace
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build Full installer
        if: matrix.os != 'macos-latest' || steps.apple_sign.outputs.enabled != 'true'
        run: bun run tauri build --target ${{ matrix.target }}
        working-directory: ./Code-Companion/artifacts/blkspace
      - name: Sign Windows Full installer
        if: matrix.os == 'windows-latest' && steps.win_sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "blkspace-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT))
          $bundle = "Code-Companion/artifacts/blkspace/src-tauri/target/${{ matrix.target }}/release/bundle/msi"
          Get-ChildItem $bundle -Filter *.msi | ForEach-Object {
            signtool sign /fd SHA256 /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 /d "BlkSpace Full" $_.FullName
          }
          Remove-Item $certPath -Force
      - name: Package Full artifact
        shell: bash
        run: |
          BUNDLE="Code-Companion/artifacts/blkspace/src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "${{ matrix.ext }}" = "msi" ]; then
            cp "$BUNDLE/msi"/*.msi "$BUNDLE/msi/BlkSpace-Full-Windows-x64.msi"
          elif [ "${{ matrix.ext }}" = "dmg" ]; then
            cp "$BUNDLE/dmg"/*.dmg "$BUNDLE/dmg/BlkSpace-Full-macOS-${{ matrix.arch }}.dmg"
          elif [ "${{ matrix.ext }}" = "appimage" ]; then
            cp "$BUNDLE/appimage"/*.AppImage "$BUNDLE/appimage/BlkSpace-Full-Linux.AppImage"
          fi
      - name: Upload Full artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Code-Companion/artifacts/blkspace/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.ext }}/BlkSpace-Full-*
          tag_name: ${{ github.ref_name }}
