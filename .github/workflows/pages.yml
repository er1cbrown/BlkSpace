# Campus web preview — no MSI required.
# https://er1cbrown.github.io/BlkSpace/  (after GitHub Pages is enabled on the repo)
name: Deploy Web Preview (Pages)

on:
  push:
    branches: [main]
    paths:
      - "Code-Companion/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

env:
  PNPM_VERSION: 10
  NODE_VERSION: 22

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build web preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: Code-Companion/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ./Code-Companion
      - name: Build frontend (project Pages base)
        run: pnpm --filter @workspace/blkspace run build
        working-directory: ./Code-Companion
        env:
          PORT: 24442
          # Project site: https://<user>.github.io/BlkSpace/
          BASE_PATH: /BlkSpace/
      - name: Write campus demo index note
        run: |
          PUB="Code-Companion/artifacts/blkspace/dist/public"
          if [ ! -d "$PUB" ]; then
            # Vite outDir may be dist only
            PUB="Code-Companion/artifacts/blkspace/dist"
          fi
          echo "<!-- BlkSpace campus web preview · Tier 0 UI · uploads/post need desktop Yard MSI for full features -->" >> "$PUB/index.html"
          ls -la "$PUB" | head -20
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Code-Companion/artifacts/blkspace/dist/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
