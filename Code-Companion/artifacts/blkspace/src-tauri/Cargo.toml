[package]
name = "app"
version = "0.1.1"
description = "BKSPC — campus social network"
authors = ["Eric Brown"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.81"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
# Embedded Turso. `sync` turns on the cloud replica when TURSO_DATABASE_URL
# and TURSO_AUTH_TOKEN are set. Without those, the app stays on the local file.
turso = { version = "0.8.0-pre.2", default-features = false, features = ["sync"] }
chrono = "0.4"
dirs = "6.0"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
secp256k1 = { version = "0.30", features = ["global-context"] }
sha2 = "0.10"
base64 = "0.22"
bitcoin = { version = "0.32", default-features = false, features = ["rand"] }
tokio = { version = "1", features = ["full"] }
nostr-sdk = { version = "0.38", features = [] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
async-trait = "0.1"
# Full build: iroh 1.x Endpoint + iroh-blobs 0.103 (sendme-compatible BlobTicket / hole-punch).
# Yard: cargo build --no-default-features (no iroh). Do not depend on the sendme crate.
iroh = { version = "1", optional = true }
iroh-blobs = { version = "0.103", features = ["fs-store"], optional = true }
bytes = "1"
keyring = "3"
chacha20poly1305 = "0.10"
rand = "0.8"
tauri-plugin-playwright = { version = "0.4.0", optional = true }
solana-client = { version = "2.2", optional = true }
solana-sdk = { version = "2.2", optional = true }
solana-transaction-status = { version = "2.2", optional = true }
spl-token = { version = "7.0", features = ["no-entrypoint"], optional = true }
spl-associated-token-account = { version = "6.0", features = ["no-entrypoint"], optional = true }
bincode = { version = "1.3", optional = true }
bs58 = { version = "0.5", optional = true }
# Full build only: native Rust Reticulum core for the T3 degraded tier.
# See docs/implementation/DELIVERY_TIER_CONCEPT.md.
#
# LICENSE: the upstream project (lelloman/rns-rs) ships a custom, NON-OSI
# "Reticulum License" with use restrictions. It is under active review, so this
# dependency is optional and feature-gated: it never reaches a Yard build, and
# removing the `rns-t3` feature removes the dependency entirely.
#
# Pinned exactly (=) because the crate is pre-1.0 and its API is expected to
# break. Re-verify provenance and license on every bump: at least three
# repositories circulate with differing terms.
rns-core = { version = "=0.1.17", optional = true }
# Direct dependency for the T3 payload layer. rns-crypto is already in the tree
# as a transitive dep of rns-core at this exact version, so this adds no new
# code to the build — it only makes the Ed25519/X25519 identity, the
# destination naming, and the packet encryption reachable from our own modules.
#
# Pin matches rns-core's. If these two ever disagree on a version, cargo resolves
# two copies of the crypto stack and a signature made by one will not verify in
# the other. Keep them locked together.
rns-crypto = { version = "=0.1.10", optional = true }
# rns-net is NOT a dependency, deliberately.
#
# rns-net 0.7.2 is the socket/interface layer (TCP, Local, serial, KISS) plus the
# node driver. It does not compile on Windows: 85 errors, of two kinds.
#
#   error[E0433]: cannot find `unix` in `os`   (std::os::unix does not exist)
#   error[E0425]: cannot find value `B9600` in crate `libc`   (POSIX baud rates)
#
# Upstream gates some of this for `target_os = "linux"`, but the
# `#[cfg(not(target_os = "linux"))]` fallback in `rns-net/src/interface/mod.rs`
# still takes a `std::os::unix::io::RawFd`, and five further POSIX references
# (lines 48, 90, 123, 208, 233) carry no cfg at all. The crate is therefore
# Linux/Unix-only in practice. `rns-net`'s CI runs `ubuntu-latest` exclusively
# and never mentions Windows, which is why this was never caught. Confirmed still
# present on master at 2026-09-25, so there is no unreleased fix to pin.
#
# Setting `default-features = false` with only `iface-tcp` + `iface-local` does
# NOT avoid it: the feature flags gate interface *registration*, not the module
# bodies, so the POSIX code is still compiled.
#
# The routing that T3 actually needs — `rns_core::transport::TransportEngine`,
# path and rate tables, announce handling, links, channels — lives in rns-core,
# which builds on Windows. Only the socket layer is blocked. Re-evaluate when
# upstream adds a Windows target to ci.yml.

[features]
default = ["iroh", "iroh-net"]
iroh = ["dep:iroh-blobs", "dep:iroh"]
# Share-ticket P2P (`ticket_for_hash` / `download_ticket`). Yard omits both via --no-default-features.
iroh-net = ["iroh"]
bkspc-devnet = [
  "dep:solana-client",
  "dep:solana-sdk",
  "dep:solana-transaction-status",
  "dep:spl-token",
  "dep:spl-associated-token-account",
  "dep:bincode",
  "dep:bs58",
]
e2e-testing = ["dep:tauri-plugin-playwright"]
# Route B / T3 degraded tier. Opt-in: not in `default`, so Yard and ordinary
# Full builds are unaffected.
#
# Still not a working transport. rns-core supplies the routing engine; it does
# not open a socket, spawn a node, or move a packet, and `courier_available`
# stays false until one has been observed. See DELIVERY_TIER_CONCEPT.md and the
# rns-net note above for why no interface layer is linked yet.
rns-t3 = ["dep:rns-core", "dep:rns-crypto"]

# Full: Iroh 1.x Endpoint + iroh-blobs 0.103 (sendme-compatible BlobTicket).
# Yard: `--no-default-features` (no magicsock). Do not `cargo add sendme`.

[dev-dependencies]
tempfile = "3"

# --- Tier 0 / multi-OS release shape ---
# Yard installs: smaller binary, less RAM, still decent CPU on weak laptops.
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# Dev: compile heavy Turso crates optimized so `tauri dev` is usable on 4–8 GB machines.
[profile.dev.package.turso]
opt-level = 2
[profile.dev.package.turso_core]
opt-level = 2
[profile.dev.package.turso_sdk_kit]
opt-level = 2
[profile.dev.package.turso_sync_sdk_kit]
opt-level = 2
[profile.dev.package.turso_parser]
opt-level = 2
