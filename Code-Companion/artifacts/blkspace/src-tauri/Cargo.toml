[package]
name = "app"
version = "0.1.1"
description = "BKSPC — campus social network"
authors = ["Eric Brown"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.81"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
# Embedded Turso. `sync` turns on the cloud replica when TURSO_DATABASE_URL
# and TURSO_AUTH_TOKEN are set. Without those, the app stays on the local file.
turso = { version = "0.8.0-pre.2", default-features = false, features = ["sync"] }
chrono = "0.4"
dirs = "6.0"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
secp256k1 = { version = "0.30", features = ["global-context"] }
sha2 = "0.10"
base64 = "0.22"
bitcoin = { version = "0.32", default-features = false, features = ["rand"] }
tokio = { version = "1", features = ["full"] }
nostr-sdk = { version = "0.38", features = [] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
async-trait = "0.1"
# Full build: iroh 1.x Endpoint + iroh-blobs 0.103 (sendme-compatible BlobTicket / hole-punch).
# Yard: cargo build --no-default-features (no iroh). Do not depend on the sendme crate.
iroh = { version = "1", optional = true }
iroh-blobs = { version = "0.103", features = ["fs-store"], optional = true }
bytes = "1"
keyring = "3"
chacha20poly1305 = "0.10"
rand = "0.8"
tauri-plugin-playwright = { version = "0.4.0", optional = true }
solana-client = { version = "2.2", optional = true }
solana-sdk = { version = "2.2", optional = true }
solana-transaction-status = { version = "2.2", optional = true }
spl-token = { version = "7.0", features = ["no-entrypoint"], optional = true }
spl-associated-token-account = { version = "6.0", features = ["no-entrypoint"], optional = true }
bincode = { version = "1.3", optional = true }
bs58 = { version = "0.5", optional = true }
# Full build only: native Rust Reticulum core for the T3 degraded tier.
# See docs/implementation/DELIVERY_TIER_CONCEPT.md.
#
# LICENSE: the upstream project (lelloman/rns-rs) ships a custom, NON-OSI
# "Reticulum License" with use restrictions. It is under active review, so this
# dependency is optional and feature-gated: it never reaches a Yard build, and
# removing the `rns-t3` feature removes the dependency entirely.
#
# Pinned exactly (=) because the crate is pre-1.0 and its API is expected to
# break. Re-verify provenance and license on every bump: at least three
# repositories circulate with differing terms.
rns-core = { version = "=0.1.17", optional = true }

[features]
default = ["iroh", "iroh-net"]
iroh = ["dep:iroh-blobs", "dep:iroh"]
# Share-ticket P2P (`ticket_for_hash` / `download_ticket`). Yard omits both via --no-default-features.
iroh-net = ["iroh"]
bkspc-devnet = [
  "dep:solana-client",
  "dep:solana-sdk",
  "dep:solana-transaction-status",
  "dep:spl-token",
  "dep:spl-associated-token-account",
  "dep:bincode",
  "dep:bs58",
]
e2e-testing = ["dep:tauri-plugin-playwright"]
# Route B / T3 degraded tier. Opt-in: not in `default`, so Yard and ordinary
# Full builds are unaffected. Gates the Reticulum capability probe only — it is
# not yet a working transport, and the UI reports it as unavailable until a
# live courier is proven. See DELIVERY_TIER_CONCEPT.md.
rns-t3 = ["dep:rns-core"]

# Full: Iroh 1.x Endpoint + iroh-blobs 0.103 (sendme-compatible BlobTicket).
# Yard: `--no-default-features` (no magicsock). Do not `cargo add sendme`.

[dev-dependencies]
tempfile = "3"

# --- Tier 0 / multi-OS release shape ---
# Yard installs: smaller binary, less RAM, still decent CPU on weak laptops.
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# Dev: compile heavy Turso crates optimized so `tauri dev` is usable on 4–8 GB machines.
[profile.dev.package.turso]
opt-level = 2
[profile.dev.package.turso_core]
opt-level = 2
[profile.dev.package.turso_sdk_kit]
opt-level = 2
[profile.dev.package.turso_sync_sdk_kit]
opt-level = 2
[profile.dev.package.turso_parser]
opt-level = 2
