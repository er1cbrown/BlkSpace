<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>BlkSpace — The social network that pays you to post</title>
    <meta name="description" content="BlkSpace: social network + creator economy. Post, earn WeixBucks, cash out to BKSPC. Works on any laptop or phone." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="BlkSpace — The social network that pays you to post" />
    <meta property="og:description" content="Post, earn, cash out. BlkSpace is the HBCU-first amalgamation social network." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bkspc.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BlkSpace" />
    <meta name="twitter:description" content="The social network that pays you to post. Earn WeixBucks, cash out to BKSPC on Solana." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Boot splash — orange solid B → clear outline B (no JS/CSS bundle required) */
      #tauri-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c0a09;
        color: #fff;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #tauri-loading.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #tauri-loading .boot-wrap {
        text-align: center;
        user-select: none;
      }
      #tauri-loading .boot-stage {
        position: relative;
        width: 5.5rem;
        height: 5.5rem;
        margin: 0 auto 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #tauri-loading .boot-glow {
        position: absolute;
        inset: -40%;
        border-radius: 9999px;
        background: rgba(249, 115, 22, 0.28);
        filter: blur(28px);
        animation: boot-glow 2.4s ease-in-out infinite;
      }
      #tauri-loading .boot-b {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4.25rem;
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 1;
      }
      #tauri-loading .boot-b-fill {
        color: #f97316;
        animation: boot-fill 2.4s ease-in-out infinite;
      }
      #tauri-loading .boot-b-clear {
        color: transparent;
        -webkit-text-stroke: 2.5px #f97316;
        text-stroke: 2.5px #f97316;
        animation: boot-clear 2.4s ease-in-out infinite;
      }
      #tauri-loading .boot-label {
        font-size: 0.875rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.55);
        letter-spacing: 0.04em;
      }
      #tauri-loading .boot-bar-track {
        margin: 0.85rem auto 0;
        height: 2px;
        width: 6rem;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      #tauri-loading .boot-bar {
        height: 100%;
        width: 35%;
        border-radius: 9999px;
        background: #f97316;
        animation: boot-bar 1.4s ease-in-out infinite;
      }
      @keyframes boot-fill {
        0%, 15% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 14px rgba(249,115,22,0.6)); }
        45%, 55% { opacity: 0; transform: scale(0.92); filter: none; }
        85%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 14px rgba(249,115,22,0.6)); }
      }
      @keyframes boot-clear {
        0%, 15% { opacity: 0; transform: scale(1.08); }
        45%, 55% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 10px rgba(249,115,22,0.35)); }
        85%, 100% { opacity: 0; transform: scale(1.08); }
      }
      @keyframes boot-glow {
        0%, 100% { opacity: 0.55; transform: scale(1); }
        50% { opacity: 0.18; transform: scale(1.2); }
      }
      @keyframes boot-bar {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #tauri-loading .boot-b-fill,
        #tauri-loading .boot-b-clear,
        #tauri-loading .boot-glow,
        #tauri-loading .boot-bar {
          animation: none !important;
        }
        #tauri-loading .boot-b-fill { opacity: 1; }
        #tauri-loading .boot-b-clear { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="tauri-loading" aria-busy="true" aria-label="Loading BlkSpace">
      <div class="boot-wrap">
        <div class="boot-stage" aria-hidden="true">
          <div class="boot-glow"></div>
          <span class="boot-b boot-b-fill">B</span>
          <span class="boot-b boot-b-clear">B</span>
        </div>
        <div class="boot-label">BlkSpace</div>
        <div class="boot-bar-track"><div class="boot-bar"></div></div>
      </div>
    </div>
    <script src="/buffer-polyfill.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function hideLoader() {
        const loader = document.getElementById("tauri-loading");
        if (!loader) return;
        const root = document.getElementById("root");
        let attempts = 0;
        const maxAttempts = 80;
        const hide = () => {
          loader.classList.add("is-hidden");
          setTimeout(function () {
            loader.style.display = "none";
          }, 400);
        };
        const check = () => {
          attempts++;
          if (root && root.children.length > 0) {
            hide();
            return;
          }
          if (attempts < maxAttempts) setTimeout(check, 250);
        };
        setTimeout(function () {
          if (!loader.classList.contains("is-hidden")) hide();
        }, 45000);
        check();
      })();
      window.addEventListener("error", function (e) {
        const loader = document.getElementById("tauri-loading");
        if (loader) {
          loader.classList.remove("is-hidden");
          loader.style.display = "flex";
          loader.style.background = "#1c0a0a";
          loader.style.color = "#fecaca";
          loader.innerHTML =
            '<div style="padding:24px;font-family:monospace;max-width:90%;margin:0 auto;text-align:left">' +
            "<h2 style='color:#f87171;margin:0 0 12px'>Something went wrong</h2>" +
            '<pre style="white-space:pre-wrap;font-size:12px">' +
            (e.message || e) +
            "</pre></div>";
        }
      });
    </script>
  </body>
</html>
