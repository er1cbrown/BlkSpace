[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = false

# Both deploy scripts end with `vm.writeFile("deployments/last-run.json", ...)`.
# Without this permission Foundry reverts on that call at the very end of `run()`,
# AFTER the contracts are constructed — so `--broadcast` never completes and no
# deployment record is written. Scoped to ./deployments only.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
# BI9 deployment targets. The contracts are chain-agnostic EVM at evm_version = cancun.
# HyperEVM (999/998) was dropped 2026-10-08: Hyperliquid geo-restricts the United States.
# Canonical on-chain asset is BKSPC on Solana -- see docs/canonical-chain-decision.md.
# This file retains BI9 as a deployable ERC-20 if a second asset is ever wanted.
ethereum = "https://eth.llamarpc.com"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
