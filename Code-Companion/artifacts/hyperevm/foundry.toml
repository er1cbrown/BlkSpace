[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = false

# Hyperliquid HyperEVM — canonical home of BI9 (see docs/tokenomics.md)
# Mainnet chain id 999 · testnet 998

[rpc_endpoints]
hyperevm = "https://rpc.hyperliquid.xyz/evm"
hyperevm_testnet = "https://rpc.hyperliquid-testnet.xyz/evm"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
